[project]
name = "agrosmart-visao"
version = "0.1.0"
description = "Modulo de visao computacional do AgroSmart: indice de dano a partir de imagens do talhao"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32",
  "numpy>=1.26",
  "pillow>=10.0",
  # API HTTP (secao 5.3 da documentacao)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]
# O treino roda em GPU, fora desta maquina. Instalado so por quem vai treinar.
treino = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.66"]

[project.scripts]
visao = "visao.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Guia de estilo do Python (RNF03), o par do Prettier nos modulos em JavaScript:
#   python -m ruff check . && python -m ruff format --check .
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Erros, avisos, ordem dos imports, sintaxe moderna e padroes que costumam ser defeito.
select = ["E", "F", "W", "I", "UP", "B"]
# B008: File(...) como valor padrao e o idioma documentado do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Gera um README com tabela em Markdown: a linha da tabela nao pode ser quebrada.
"treino/gerar_fotos_de_demonstracao.py" = ["E501"]
