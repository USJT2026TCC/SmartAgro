[project]
name = "agrosmart-simulador"
version = "0.1.0"
description = "Simulador de estacoes meteorologicas do AgroSmart, com dados reais do INMET"
requires-python = ">=3.10"
dependencies = ["requests>=2.32", "eth-account>=0.13", "paho-mqtt>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
simulador = "simulador.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Guia de estilo do Python (RNF03), o par do Prettier nos modulos em JavaScript:
#   python -m ruff check . && python -m ruff format --check .
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Erros, avisos, ordem dos imports, sintaxe moderna e padroes que costumam ser defeito.
select = ["E", "F", "W", "I", "UP", "B"]
# B008: File(...) como valor padrao e o idioma documentado do FastAPI.
ignore = ["B008"]
